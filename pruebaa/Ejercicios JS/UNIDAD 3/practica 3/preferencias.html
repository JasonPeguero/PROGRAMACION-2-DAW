<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Preferencias del operador · ALBOR LOGISTICS</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>
<body class="bg-light">
  <main class="container my-4" style="max-width: 760px;">
    <h1 class="h3 mb-2">Preferencias del operador</h1>
    <p class="text-secondary">ALBOR LOGISTICS · Configura tus preferencias del panel.</p>

    <section class="card mb-3">
      <div class="card-header">Configuración</div>
      <div class="card-body">
        <form id="formularioPreferencias">
          <div class="mb-3">
            <label for="nombre" class="form-label">Nombre del operador</label>
            <input id="nombre" name="nombre" class="form-control" type="text" required>
          </div>

          <div class="mb-3">
            <label for="idioma" class="form-label">Idioma</label>
            <select id="idioma" name="idioma" class="form-select">
              <option value="Español">Español</option>
              <option value="Inglés">Inglés</option>
            </select>
          </div>

          <div class="mb-3">
            <label for="viajes" class="form-label">Viajes que deseas visualizar</label>
            <select id="viajes" name="viajes" class="form-select">
              <option value="10">10</option>
              <option value="20">20</option>
              <option value="50">50</option>
            </select>
          </div>

          <div class="mb-3">
            <label for="panel" class="form-label">Último panel utilizado</label>
            <select id="panel" name="panel" class="form-select">
              <option value="Viajes">Viajes</option>
              <option value="Camiones">Camiones</option>
              <option value="Conductores">Conductores</option>
              <option value="Clientes">Clientes</option>
            </select>
          </div>

          <button type="submit" class="btn btn-primary">Guardar preferencias</button>
          <button type="button" id="btnConsultar" class="btn btn-secondary">Consultar preferencias</button>
          <button type="button" id="btnEliminar" class="btn btn-danger">Eliminar preferencias</button>
          <button type="button" id="btnRestablecer" class="btn btn-outline-secondary">Restablecer</button>
        </form>
      </div>
    </section>

    <div id="mensaje" class="alert alert-info" role="status" aria-live="polite"></div>
    <section id="resultado" class="card" hidden>
      <div class="card-header">Preferencias guardadas</div>
      <div id="detallePreferencias" class="card-body"></div>
    </section>
  </main>

  <script src="js/cookies.js"></script>
</body>
</html>
