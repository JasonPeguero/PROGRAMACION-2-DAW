<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Generador de partes de viaje · ALBOR LOGISTICS</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>
<body>
  <main class="container my-4" style="max-width: 760px;">
    <h1 class="h3">Generador de partes de viaje</h1>
    <p>Introduce los datos del servicio para crear el parte de ALBOR LOGISTICS.</p>

    <form id="formularioViaje" class="card card-body mb-3">
      <div class="row g-3">
        <div class="col-md-6">
          <label for="codigo" class="form-label">Código del viaje</label>
          <input id="codigo" type="text" class="form-control" placeholder="VIA-001" required>
        </div>
        <div class="col-md-6">
          <label for="matricula" class="form-label">Matrícula</label>
          <input id="matricula" type="text" class="form-control" placeholder="1234ABC" required>
        </div>
        <div class="col-md-6">
          <label for="conductor" class="form-label">Conductor</label>
          <input id="conductor" type="text" class="form-control" required>
        </div>
        <div class="col-md-6">
          <label for="distancia" class="form-label">Distancia (km)</label>
          <input id="distancia" type="number" class="form-control" min="0" required>
        </div>
        <div class="col-md-6">
          <label for="origen" class="form-label">Origen</label>
          <input id="origen" type="text" class="form-control" required>
        </div>
        <div class="col-md-6">
          <label for="destino" class="form-label">Destino</label>
          <input id="destino" type="text" class="form-control" required>
        </div>
        <div class="col-md-6">
          <label for="estado" class="form-label">Estado del viaje</label>
          <select id="estado" class="form-select" required>
            <option value="PENDIENTE">Pendiente</option>
            <option value="EN RUTA">En ruta</option>
            <option value="FINALIZADO">Finalizado</option>
            <option value="INCIDENCIA">Incidencia</option>
          </select>
        </div>
      </div>
      <div class="mt-3">
        <button type="submit" class="btn btn-primary">Generar parte</button>
      </div>
    </form>

    <div id="mensaje" role="status"></div>

    <section id="parteGenerado" class="card" hidden>
      <div class="card-header"><strong>ALBOR LOGISTICS · PARTE DE VIAJE</strong></div>
      <div class="card-body">
        <div id="resultado"></div>
        <button id="abrirParte" type="button" class="btn btn-secondary">Abrir parte en nueva ventana</button>
      </div>
    </section>
  </main>

  <script src="js/parte.js"></script>
</body>
</html>
