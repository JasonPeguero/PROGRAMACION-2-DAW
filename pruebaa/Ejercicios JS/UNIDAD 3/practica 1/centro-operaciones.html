<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Centro de operaciones · ALBOR LOGISTICS</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>
<body>
  <main class="container my-4" style="max-width: 720px;">
    <h1 class="h3 mb-4">Centro de operaciones · ALBOR LOGISTICS</h1>

    <section class="card mb-3">
      <div class="card-header">Recursos de trabajo</div>
      <div class="card-body d-flex flex-wrap gap-2">
        <button id="btnPanel" class="btn btn-primary">Abrir panel de operaciones</button>
        <button id="btnSeguimiento" class="btn btn-primary">Abrir seguimiento</button>
        <button id="btnWeb" class="btn btn-primary">Abrir web corporativa</button>
      </div>
    </section>

    <section class="card mb-3">
      <div class="card-header">Navegación</div>
      <div class="card-body d-flex flex-wrap gap-2">
        <button id="btnRecargar" class="btn btn-secondary">Recargar página</button>
        <button id="btnVolver" class="btn btn-secondary">Volver atrás</button>
        <button id="btnMostrarURL" class="btn btn-secondary">Mostrar URL actual</button>
      </div>
    </section>

    <section class="card mb-3">
      <div class="card-header">Ventana de seguimiento</div>
      <div class="card-body">
        <label for="txtURL" class="form-label">URL de destino</label>
        <div class="input-group">
          <input type="text" id="txtURL" class="form-control" placeholder="https://www.ejemplo.com">
          <button id="btnCargarURL" class="btn btn-success">Cargar URL</button>
        </div>
      </div>
    </section>

    <div id="mensaje" role="status"></div>

    <section class="card">
      <div class="card-header">Información del entorno</div>
      <ul class="list-group list-group-flush">
        <li class="list-group-item"><strong>URL actual:</strong> <span id="infoURL" class="text-break"></span></li>
        <li class="list-group-item"><strong>Protocolo:</strong> <span id="infoProtocolo"></span></li>
        <li class="list-group-item"><strong>Nombre del navegador/plataforma:</strong> <span id="infoPlataforma" class="text-break"></span></li>
      </ul>
    </section>
  </main>

  <script src="js/app.js"></script>
</body>
</html>
