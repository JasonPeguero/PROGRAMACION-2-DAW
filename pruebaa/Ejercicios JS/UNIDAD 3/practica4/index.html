<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Panel de seguimiento · ALBOR LOGISTICS</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>
<body>
  <main class="container my-4">
    <h1 class="h3">ALBOR LOGISTICS</h1>
    <hr>

    <nav class="d-flex flex-wrap gap-2 mb-3">
      <button class="btn btn-outline-primary" data-pagina="viajes.html">Viajes</button>
      <button class="btn btn-outline-primary" data-pagina="camiones.html">Camiones</button>
      <button class="btn btn-outline-primary" data-pagina="conductores.html">Conductores</button>
    </nav>
    <hr>

    <div class="d-flex flex-wrap gap-2 mb-3">
      <button id="btnRecargar" class="btn btn-secondary">Recargar contenido</button>
      <button id="btnNuevaVentana" class="btn btn-secondary">Abrir contenido en nueva ventana</button>
    </div>

    <div id="mensaje" role="status"></div>

    <!-- Lo que se muestra dentro del iframe -->
    <iframe id="marco" title="Contenido del panel" class="w-100 border rounded mb-3" style="height: 320px;"></iframe>

    <section class="card">
      <div class="card-header">Información</div>
      <ul class="list-group list-group-flush">
        <li class="list-group-item"><strong>Aplicación:</strong> <span id="infoApp"></span></li>
        <li class="list-group-item"><strong>URL actual:</strong> <span id="infoURL" class="text-break"></span></li>
        <li class="list-group-item"><strong>Plataforma:</strong> <span id="infoPlataforma" class="text-break"></span></li>
        <li class="list-group-item"><strong>Contenido mostrado:</strong> <span id="infoPagina"></span></li>
      </ul>
    </section>
  </main>

  <script src="js/app.js"></script>
</body>
</html>
