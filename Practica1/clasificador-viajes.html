<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clasificador de Viajes</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">

</head>
<body>
    <div class = "container-sm mt-5">
<form id="formulario">
  <div class="mb-3">
    <label for="CodigoViaje" class="form-label">Código del viaje<span>*</span></label>
    <input type="text" class="form-control" id="CodigoViaje" name="CodigoViaje" aria-describedby="CodigoViaje">
  </div>

  <div class="mb-3">
    <label for="MatriculaCamion" class="form-label">Matrícula del camión<span>*</span></label>
    <input type="text" class="form-control" id="MatriculaCamion" name="MatriculaCamion">
  </div>

  <div class="mb-3">
    <label for="CiudadOrigen" class="form-label">Ciudad de origen<span>*</span></label>
    <input type="text" class="form-control" id="CiudadOrigen" name="CiudadOrigen">
  </div>

  <div class="mb-3">
    <label for="CiudadDestino" class="form-label">Ciudad de destino<span>*</span></label>
    <input type="text" class="form-control" id="CiudadDestino" name="CiudadDestino">
  </div>

  <div class="mb-3">
    <label for="EstadoViaje" class="form-label">Estado del viaje<span>*</span></label>
    <input type="text" class="form-control" id="EstadoViaje" name="EstadoViaje" onblur="validarEstadoViaje()">
  </div>
  
    <button type="button" class="btn btn-primary" onclick="validar()">Enviar</button>
</form>
    </div>
<script src="js/app.js"></script>
<br>
<br>
</body>
</html>
